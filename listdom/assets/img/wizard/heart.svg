<svg xmlns="http://www.w3.org/2000/svg" data-role="usage-data" viewBox="0 0 180 94" role="img" aria-labelledby="usage-data-title">
    <title id="usage-data-title">A heart representing helping improve Listdom</title>
    <style>
        [data-role="heart-entrance"] { transform-box: fill-box; transform-origin: center; animation: heart-enter .95s .12s cubic-bezier(.22,.61,.36,1) both; }
        [data-role="heart-core"] { transform-box: fill-box; transform-origin: center; transform: scale(.72, .78); animation: heart-pulse 2.8s ease-in-out .95s infinite; }
        @keyframes heart-enter { 0% { opacity: 0; filter: blur(12px); transform: scale(.62); } 68% { opacity: 1; filter: blur(0); transform: scale(1.06); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }
        @keyframes heart-pulse { 0%, 100% { transform: scale(.72, .78); } 50% { transform: scale(.77, .83); } }
        @media (prefers-reduced-motion: reduce) { [data-role="heart-entrance"], [data-role="heart-core"] { animation: none; filter: none; opacity: 1; } [data-role="heart-core"] { transform: scale(.72, .78); } }
    </style>
    <g data-role="heart-entrance">
        <g data-role="heart-core">
            <path d="M90 79C84 73 43 50 43 26 43 13 53 4 65 4c11 0 19 6 25 17 6-11 14-17 25-17 12 0 22 9 22 22 0 24-41 47-47 53Z" fill="#e66a9d" opacity=".24"></path>
        </g>
    </g>
</svg>
